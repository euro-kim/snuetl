[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "snuetl"
version = "0.7.1"
description = "Synchronize files from Seoul National University eTL"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "snuetl contributors" }]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
dependencies = [
  "beautifulsoup4>=4.12,<5",
  "discord.py>=2.7,<3",
  "httpx>=0.27,<1",
  "markdownify>=1.2,<2",
  "playwright>=1.57,<2",
  "PyYAML>=6,<7",
  "rich>=13.9,<16",
  "yt-dlp>=2025.1.15",
]

[project.optional-dependencies]
test = ["mypy>=1.14,<2", "pytest>=8,<10", "ruff>=0.9,<1"]

[project.scripts]
snuetl = "snuetl.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/snuetl"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
files = [
  "src/snuetl/browser_contracts.py",
  "src/snuetl/canvas_adapter.py",
  "src/snuetl/cli_parser.py",
  "src/snuetl/cli_runtime.py",
  "src/snuetl/discovery.py",
  "src/snuetl/discord_access.py",
  "src/snuetl/discord_config.py",
  "src/snuetl/discord_jobs.py",
  "src/snuetl/discord_operations.py",
  "src/snuetl/discord_presenter.py",
  "src/snuetl/discord_setup.py",
  "src/snuetl/discord_ui.py",
  "src/snuetl/dom_adapter.py",
  "src/snuetl/file_sync.py",
  "src/snuetl/lms_session.py",
  "src/snuetl/logging_utils.py",
  "src/snuetl/media.py",
  "src/snuetl/routing.py",
]
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
