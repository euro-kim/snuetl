[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "snuetl"
version = "0.4.0"
description = "Synchronize files from Seoul National University eTL"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "snuetl contributors" }]
dependencies = [
  "httpx>=0.27,<1",
  "playwright>=1.48,<2",
  "rich>=13.9,<16",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
snuetl = "snuetl.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/snuetl"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "SIM"]
ignore = ["E501"]
