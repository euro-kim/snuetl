[general]
# The login entry point redirects authenticated users to the LMS.
base_url = "https://etl.snu.ac.kr/login"
download_dir = "~/Downloads/snuetl"
setup_complete = false
# state_dir = "~/.local/state/snuetl"

[browser]
# "bundled" uses the Chromium installed by `playwright install chromium`.
# Set this to "chrome" to use Google Chrome instead.
channel = "bundled"
headless = true
login_timeout_seconds = 600

[sync]
timeout_seconds = 45
retry_count = 3
excluded_course_ids = []
