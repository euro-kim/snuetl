[general]
# The login entry point redirects authenticated users to the LMS.
base_url = "https://etl.snu.ac.kr/login"
download_dir = "~/Downloads/snuetl"
setup_complete = false
# Set by guided setup after the Canvas API access prompt.
# canvas_api_enabled = true
# state_dir = "~/.local/state/snuetl"

[browser]
# Firefox is the smaller default for Linux and Docker. Set engine to "chromium"
# only when a site-compatibility issue requires it.
engine = "firefox"
# Chromium only: "bundled" uses `playwright install chromium`; "chrome" uses
# an installed Google Chrome channel.
channel = "bundled"
# Raspberry Pi OS can fall back to its system Chromium package automatically.
# executable_path = "/usr/bin/chromium"
headless = true
login_timeout_seconds = 600

[sync]
timeout_seconds = 45
retry_count = 3
excluded_course_ids = []

[telegram]
# Run `snuetl telegram setup` to pair a private chat; it fills in the IDs.
enabled = false
owner_id = ""
chat_id = ""
alerts_enabled = true
