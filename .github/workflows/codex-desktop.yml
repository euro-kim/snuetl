name: Build Codex desktop helpers

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build Mac helper and installer
        run: bash macos-client/build.sh
      - name: Check packaged helper
        run: macos-client/dist/snuetl-codex/snuetl-codex status
      - uses: actions/upload-artifact@v4
        with:
          name: snuetl-codex-${{ matrix.runner }}
          path: macos-client/dist/snuetl-codex-macos-*.dmg

  windows:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build Windows helper and installer
        shell: pwsh
        run: windows-client/codex-helper/build.ps1
      - name: Check packaged helper
        shell: pwsh
        run: .\windows-client\codex-helper\dist\snuetl-codex\snuetl-codex.exe status
      - uses: actions/upload-artifact@v4
        with:
          name: snuetl-codex-windows-x64
          path: windows-client/codex-helper/dist/snuetl-codex-windows-x64.msi
