name: Build Codex desktop helpers

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  macos:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build Mac helper and installer
        run: bash packaging/macos/build.sh
      - name: Check packaged helper
        run: dist/snuetl-codex/snuetl-codex status
      - uses: actions/upload-artifact@v4
        with:
          name: snuetl-codex-${{ matrix.runner }}
          path: dist/snuetl-codex-macos-*.dmg

  windows:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build Windows helper and installer
        shell: pwsh
        run: packaging/windows/build.ps1
      - name: Check packaged helper
        shell: pwsh
        run: .\dist\snuetl-codex\snuetl-codex.exe status
      - uses: actions/upload-artifact@v4
        with:
          name: snuetl-codex-windows-x64
          path: dist/snuetl-codex-windows-x64.msi

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [macos, windows]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: snuetl-codex-*
          merge-multiple: true
          path: release
      - name: Produce release checksums
        shell: bash
        run: |
          cd release
          sha256sum snuetl-codex-macos-arm64.dmg snuetl-codex-macos-x86_64.dmg snuetl-codex-windows-x64.msi > SHA256SUMS.txt
      - name: Publish pilot release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: gh release create "${GITHUB_REF_NAME}" release/* --prerelease --title "SNUETL Codex ${GITHUB_REF_NAME}"
