name: Build Windows client

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'windows-client/**'
      - 'src/snuetl/**'
      - 'pyproject.toml'
      - '.github/workflows/windows-client.yml'
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build and test
        shell: pwsh
        run: windows-client/build.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: snuetl-windows-x64
          path: |
            windows-client/dist/SNUETLSetup.exe
            windows-client/dist/SNUETL.msi
